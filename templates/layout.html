{% extends "base.html" %}
{% block title %}Layout Map — {{ trial.name }}{% endblock %}

{% block head %}
<style>
    #map-container {
        display: flex;
        gap: 1rem;
        min-height: 500px;
    }
    #canvas-wrap {
        flex: 1;
        position: relative;
        border: 1px solid #ccc;
        background: #e8e8e8;
    }
    #layout-canvas {
        display: block;
        width: 100%;
        height: 100%;
    }
    #tooltip {
        display: none;
        position: absolute;
        background: #fff;
        border: 1px solid #999;
        padding: 0.5rem;
        font-size: 13px;
        line-height: 1.4;
        pointer-events: none;
        z-index: 10;
        box-shadow: 2px 2px 6px rgba(0,0,0,0.15);
    }
    #sidebar {
        width: 250px;
        overflow-y: auto;
        padding: 0.5rem;
        border: 1px solid #ccc;
        background: #fafafa;
    }
    #sidebar h3 {
        margin-top: 0;
    }
    .legend-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.3rem;
    }
    .legend-swatch {
        width: 18px;
        height: 18px;
        border: 1px solid #999;
        flex-shrink: 0;
    }
</style>
{% endblock %}

{% block content %}
<h1>Layout Map — {{ trial.name }}</h1>
<a href="{{ url_for('trial_detail', trial_id=trial.id) }}">&larr; Back to trial</a>

<section class="card" style="margin-bottom:1rem;">
    <form method="get" class="form-inline">
        <div class="form-group">
            <label for="trait_id">Color by trait value:</label>
            <select name="trait_id" id="trait_id">
                <option value="">— Color by treatment —</option>
                {% for t in traits %}
                <option value="{{ t.id }}" {{ "selected" if selected_trait_id == t.id else "" }}>{{ t.name }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn">Apply</button>
    </form>
</section>

<div id="map-container">
    <div id="canvas-wrap">
        <canvas id="layout-canvas"></canvas>
        <div id="tooltip"></div>
    </div>
    <div id="sidebar">
        <h3>Legend</h3>
        <div id="legend"></div>
    </div>
</div>

<script>
    var LAYOUT_DATA_URL = "{{ url_for('layout_data', trial_id=trial.id) }}" + ({{ selected_trait_id|tojson }} ? "?trait_id={{ selected_trait_id }}" : "");
    var SELECTED_TRAIT_ID = {{ selected_trait_id|tojson }};
</script>
<script src="{{ url_for('static', filename='layout.js') }}"></script>
{% endblock %}
